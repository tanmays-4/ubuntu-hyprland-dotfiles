monitor = , preferred, auto, 1.25
env = ELECTRON_OZONE_PLATFORM_HINT,auto

xwayland {
    force_zero_scaling = true
}

$terminal = kitty
$files = nautilus
$launcher = fuzzel
$mod = SUPER
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hyprlock
exec-once = qs
exec-once = blueman-applet
exec-once = systemctl --user start hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store
exec-once = /usr/libexec/gsd-rfkill
general {
    gaps_in = 3
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(ffffff26)
    col.inactive_border = rgba(ffffff0a)
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 15
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = smooth, 0.2, 0.8, 0.2, 1.0

    animation = windows, 1, 4, smooth, popin 90%
    animation = windowsOut, 1, 3, smooth, popin 90%
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 4, smooth, slide
    animation = border, 1, 6, default
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    initial_workspace_tracking = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(0a0a0b)
    disable_hyprland_guiutils_check = true
    on_focus_under_fullscreen = 1
    exit_window_retains_fullscreen = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

layerrule {
    name = shell-blur
    blur = on
    ignore_alpha = 0.3
    match:namespace = ^(bar|dock|osd|notifications|dashboard|quicksettings|switcher|overview|media|windowmenu|battery|snap|todo)$
}

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod, E, exec, $files
bind = $mod, D, exec, $launcher
bind = $mod, A, exec, qs ipc call launcher toggle
bind = $mod, SPACE, exec, qs ipc call dock toggle
bind = $mod, I, exec, env XDG_CURRENT_DESKTOP=GNOME gnome-control-center
bind = $mod, L, exec, loginctl lock-session
bind = $mod, C, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mod, F, fullscreen
bind = $mod SHIFT, F, exec, sh $HOME/.config/quickshell/scripts/maximize.sh
bind = $mod, V, togglefloating
bind = $mod, H, movetoworkspacesilent, special:minimized
bind = $mod SHIFT, H, togglespecialworkspace, minimized
bind = $mod, M, exit
bind = $mod, W, exec, qs ipc call dashboard toggle
bind = $mod SHIFT, R, exec, pkill qs; qs -d
bind = ALT, TAB, exec, qs ipc call switcher next
bind = ALT SHIFT, TAB, exec, qs ipc call switcher prev

bindrt = ALT, ALT_L, exec, qs ipc call switcher commit

bind = , Print, exec, sh $HOME/.config/quickshell/scripts/screenshot.sh
bind = $mod SHIFT, S, exec, sh $HOME/.config/quickshell/scripts/screenshot.sh area
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, TAB, exec, qs ipc call overview toggle
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && qs ipc call osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && qs ipc call osd brightness
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
gesture = 3, horizontal, workspace
gesture = 3, down, dispatcher, exec, qs ipc call dashboard toggle
gesture = 4, up, dispatcher, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
gesture = 4, down, dispatcher, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
gesture = 3, up, dispatcher, exec, qs ipc call launcher toggle

# Snap layouts
bind = $mod, Z, exec, qs ipc call snap toggle -1
bind = $mod CTRL, left, exec, python3 $HOME/.config/quickshell/scripts/snap.py left
bind = $mod CTRL, right, exec, python3 $HOME/.config/quickshell/scripts/snap.py right
bind = $mod CTRL, up, exec, python3 $HOME/.config/quickshell/scripts/snap.py max
bind = $mod CTRL, down, exec, python3 $HOME/.config/quickshell/scripts/snap.py center

# To Do app
bind = $mod, T, exec, qs ipc call todo toggle
