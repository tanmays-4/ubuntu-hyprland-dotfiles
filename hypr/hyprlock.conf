general {
    hide_cursor = false
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/flower.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = JetBrains Mono
    color = rgba(236, 236, 236, 1.0)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 16
    font_family = Inter
    color = rgba(154, 154, 154, 1.0)
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(10, 10, 11, 0.7)
    font_color = rgba(236, 236, 236, 1.0)
    check_color = rgba(255, 255, 255, 0.4)
    fail_color = rgba(255, 255, 255, 0.6)
    fail_text = Wrong password
    placeholder_text = Password
    dots_size = 0.2
    rounding = 12
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

